<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>纸雕 · 想着你</title>
<style>
  html,body{margin:0;width:100%;height:100%;background:#04070d;overflow:hidden;
    font-family:system-ui,-apple-system,"PingFang SC","Noto Sans CJK SC",sans-serif;
    -webkit-tap-highlight-color:transparent;user-select:none}
  canvas{position:fixed;inset:0;display:block;width:100vw;height:100vh;height:100dvh}
  #hud{position:fixed;left:0;right:0;bottom:0;padding:10px 14px 16px;
    color:#cfd8e6;font-size:12px;letter-spacing:.04em;pointer-events:none;
    background:linear-gradient(to top,rgba(2,6,12,.72),transparent)}
  #line{height:2px;background:rgba(255,255,255,.14);border-radius:2px;margin-bottom:8px;overflow:hidden}
  #bar{height:100%;width:0;background:linear-gradient(90deg,#ffd9a0,#ffb36b);border-radius:2px}
  #meta{display:flex;justify-content:space-between;opacity:.85}
  #tip{position:fixed;top:14px;left:0;right:0;text-align:center;color:rgba(220,230,245,.55);
    font-size:11px;letter-spacing:.08em;pointer-events:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tip">点一下暂停 / 再点继续</div>
<div id="hud">
  <div id="line"><div id="bar"></div></div>
  <div id="meta"><span id="sec">① 启航</span><span id="clock">0.0 / 24.1s · 120BPM</span></div>
</div>
<script>
"use strict";
const DUR = 24.1, BEAT = 0.5;              // 120 BPM
const W = 1000, H = 1778;                 // 设计分辨率 9:16

const cv = document.getElementById("c");
const ctx = cv.getContext("2d", { alpha: false });
const bar = document.getElementById("bar");
const secEl = document.getElementById("sec");
const clockEl = document.getElementById("clock");

/* ---------------- 时间轴 ---------------- */
const SECTIONS = [
  { t0: 0.0,  t1: 3.6,  id: 1, name: "启航" },
  { t0: 3.6,  t1: 5.7,  id: 2, name: "孤夜" },
  { t0: 5.7,  t1: 7.4,  id: 3, name: "想着你" },
  { t0: 7.4,  t1: 10.4, id: 4, name: "不惶恐" },
  { t0: 10.4, t1: 13.8, id: 5, name: "人来人往" },
  { t0: 13.8, t1: 17.3, id: 6, name: "离开" },
  { t0: 17.3, t1: 20.2, id: 7, name: "感谢" },
  { t0: 20.2, t1: 22.4, id: 8, name: "你眼中" },
  { t0: 22.4, t1: 24.1, id: 9, name: "尾声" },
];

/* ---------------- 调色板 ---------------- */
const P = {
  1: { sky: ["#0a1730", "#173257"], wave: ["#1d3a63", "#254873", "#2d5584", "#376996", "#4a7cab", "#5f92c1"],
       moon: "#f6e7c4", glow: "#ffcf8a", ink: "#0a1222" },
  2: { sky: ["#030913", "#0a1a33"], wave: ["#0d2138", "#102944", "#143252", "#183c60", "#1d476f", "#22537f"],
       moon: "#e9e2cf", glow: "#ffc98a", ink: "#040b16" },
  3: { sky: ["#123a5c", "#4a6b86"], wave: ["#1f4568", "#2a5477", "#356386", "#427395", "#5585a4", "#6f9db8"],
       moon: "#ffe9c6", glow: "#ffbe6e", ink: "#0b1726" },
  4: { sky: ["#0b1b33", "#26415e"], wave: ["#12293f", "#193650", "#204362", "#295174", "#345f86", "#48749b"],
       moon: "#fff1d0", glow: "#ffd08a", ink: "#07111c" },
  5: { sky: ["#f3b7a8", "#f7d3bb"], wave: ["#e8a391", "#eda895", "#f0b39f", "#f3bdaa", "#f6c9b7", "#f9d6c6"],
       moon: "#fff3dd", glow: "#ffb27a", ink: "#5d3a40" },
  6: { sky: ["#101f38", "#3c4a6b"], wave: ["#1a2c48", "#223755", "#2b4364", "#354f73", "#405c82", "#4e6b91"],
       moon: "#f2ecd9", glow: "#ffc98d", ink: "#070e18" },
  7: { sky: ["#3a1f1a", "#c8783b"], wave: ["#3d241d", "#4d2d22", "#5e3828", "#70442f", "#855238", "#9c6443"],
       moon: "#ffe0a8", glow: "#ffb44e", ink: "#1a0d09" },
  8: { sky: ["#0d1a2c", "#1d3350"], wave: ["#14263c", "#1b3049", "#233c58", "#2c4868", "#385779", "#47678c"],
       moon: "#fff3d8", glow: "#ffcc86", ink: "#08121f" },
  9: { sky: ["#0a1526", "#16263d"], wave: ["#16253a", "#1b2d45", "#213551", "#28405f", "#304c6d", "#3a597c"],
       moon: "#f7ead0", glow: "#ffcb8a", ink: "#060d18" },
};

/* 镜头：每个分镜起点的 zoom / 视点（0~1） ，段内平滑过渡 */
const CAM = [
  { t: 0.0,  z: 1.00, cx: .50, cy: .50 },
  { t: 3.6,  z: 0.82, cx: .50, cy: .46 },
  { t: 5.7,  z: 1.42, cx: .50, cy: .38 },
  { t: 7.4,  z: 1.00, cx: .50, cy: .52 },
  { t: 10.4, z: 1.06, cx: .50, cy: .54 },
  { t: 13.8, z: 1.00, cx: .50, cy: .52 },
  { t: 17.3, z: 0.94, cx: .50, cy: .44 },
  { t: 20.2, z: 1.55, cx: .50, cy: .34 },
  { t: 22.4, z: 1.02, cx: .50, cy: .50 },
  { t: 24.1, z: 1.00, cx: .50, cy: .50 },
];

/* ---------------- 工具 ---------------- */
const clamp = (v, a = 0, b = 1) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const frac = x => x - Math.floor(x);

function mix(c1, c2, t) {
  const p = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const a = p(c1), b = p(c2);
  return `rgb(${Math.round(lerp(a[0], b[0], t))},${Math.round(lerp(a[1], b[1], t))},${Math.round(lerp(a[2], b[2], t))})`;
}

function pal(t) {
  // 在相邻分镜调色板之间做短过渡
  let i = 0;
  while (i < SECTIONS.length - 1 && t >= SECTIONS[i].t1) i++;
  const cur = SECTIONS[i], prev = SECTIONS[Math.max(0, i - 1)];
  const k = i === 0 ? 0 : clamp((t - cur.t0) / 0.55);
  const A = P[prev.id], B = P[cur.id];
  const mixArr = (x, y) => x.map((c, j) => mix(c, y[j] || c, k));
  return {
    sky: mixArr(A.sky, B.sky),
    wave: mixArr(A.wave, B.wave),
    moon: mix(A.moon, B.moon, k),
    glow: mix(A.glow, B.glow, k),
    ink: mix(A.ink, B.ink, k),
  };
}

function camera(t) {
  let i = 0;
  while (i < CAM.length - 1 && t >= CAM[i + 1].t) i++;
  const a = CAM[i], b = CAM[Math.min(CAM.length - 1, i + 1)];
  const span = Math.max(0.001, b.t - a.t);
  const k = smooth(clamp((t - a.t) / span));
  return { z: lerp(a.z, b.z, k), cx: lerp(a.cx, b.cx, k), cy: lerp(a.cy, b.cy, k) };
}

function secAt(t) {
  for (let i = SECTIONS.length - 1; i >= 0; i--) if (t >= SECTIONS[i].t0) return SECTIONS[i];
  return SECTIONS[0];
}
const beatPulse = t => Math.pow(1 - frac(t / BEAT), 3);   // 0..1，拍点最强
const halfBlink = t => .5 + .5 * Math.cos(Math.PI * 2 * (t / BEAT)); // 半拍眨

/* ---------------- 画布 ---------------- */
let scale = 1, offX = 0, offY = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  const cw = innerWidth, ch = innerHeight;
  cv.width = Math.round(cw * DPR); cv.height = Math.round(ch * DPR);
  scale = Math.max(cw / W, ch / H);
  offX = (cw - W * scale) / 2; offY = (ch - H * scale) / 2;
}
addEventListener("resize", resize);

/* 纸纹：一次生成，逐帧叠加 */
const grain = document.createElement("canvas");
grain.width = 256; grain.height = 256;
{
  const g = grain.getContext("2d"), img = g.createImageData(256, 256);
  for (let i = 0; i < img.data.length; i += 4) {
    const v = 128 + (Math.random() * 60 - 30);
    img.data[i] = img.data[i + 1] = img.data[i + 2] = v;
    img.data[i + 3] = 16;
  }
  g.putImageData(img, 0, 0);
}
const grainPat = ctx.createPattern(grain, "repeat");

/* ---------------- 场景元素 ---------------- */
function drawSky(t, c, sc) {
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0, c.sky[0]); g.addColorStop(1, c.sky[1]);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // 分镜 2、7 的暖冷渐层
  if (sc.id === 2) {
    const rg = ctx.createRadialGradient(W * .5, H * .3, 10, W * .5, H * .3, H * .6);
    rg.addColorStop(0, "rgba(40,70,110,.35)"); rg.addColorStop(1, "rgba(0,0,0,0)");
    ctx.fillStyle = rg; ctx.fillRect(0, 0, W, H);
  }
}

function drawStars(t, c, sc) {
  const vis = sc.id === 2 ? 1 : sc.id === 1 ? .55 : sc.id === 9 ? .25 : 0;
  if (vis <= 0) return;
  ctx.save(); ctx.globalAlpha = vis;
  const blink = 1 - halfBlink(t);
  for (let i = 0; i < 46; i++) {
    const x = (i * 197.3 + 40) % W;
    const y = (i * 131.7 + 30) % (H * .55);
    const r = 1.1 + (i % 3) * .7;
    const a = .25 + .75 * blink * (.55 + .45 * Math.sin(i * 2.1));
    ctx.fillStyle = `rgba(230,240,255,${a})`;
    ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill();
  }
  ctx.restore();
}

function drawMoon(t, c, sc, cam) {
  // 分镜 8：月亮变成眼睛里的倒影，这里用同一个圆心放大代替
  let mx = W * .5, my = H * .27, mr = 150;
  if (sc.id === 2) { mx = W * .5; my = H * .24; mr = 138; }
  if (sc.id === 8) { mx = W * .5; my = H * .30; mr = 210 * (1 + .1 * smooth((t - 20.2) / 1.2)); }
  if (sc.id === 3) { mx = W * .5; my = H * .30; mr = 120; }
  if (sc.id === 4) { mx = W * .5; my = H * .22; mr = 150; }

  // 光晕
  const halo = ctx.createRadialGradient(mx, my, mr * .6, mx, my, mr * 2.6);
  halo.addColorStop(0, "rgba(255,235,190,.28)");
  halo.addColorStop(1, "rgba(255,235,190,0)");
  ctx.fillStyle = halo;
  ctx.beginPath(); ctx.arc(mx, my, mr * 2.6, 0, 7); ctx.fill();

  ctx.fillStyle = c.moon;
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.fill();

  // 月面纸纹
  ctx.save();
  ctx.globalAlpha = .12;
  ctx.beginPath(); ctx.arc(mx, my, mr, 0, 7); ctx.clip();
  ctx.fillStyle = grainPat; ctx.fillRect(mx - mr, my - mr, mr * 2, mr * 2);
  ctx.restore();

  // 分镜 2：乌云一点点吃掉月亮
  if (sc.id === 2) {
    const k = smooth((t - 3.6) / 1.4);
    ctx.save();
    ctx.fillStyle = "#04090f";
    ctx.beginPath();
    const cy = my - mr * .2 + k * mr * .4;
    ctx.ellipse(mx - mr * .2, cy, mr * 1.5, mr * (.75 + .1 * k), -.08, 0, 7);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(mx + mr * .9, cy + mr * .1, mr * 1.2, mr * .6, .06, 0, 7);
    ctx.fill();
    ctx.restore();
  }

  // 分镜 8：虹膜 / 瞳孔
  if (sc.id === 8) {
    const k = smooth((t - 20.2) / 1.1);
    ctx.save();
    ctx.strokeStyle = "rgba(10,18,30,.85)"; ctx.lineWidth = 16;
    ctx.beginPath(); ctx.arc(mx, my, mr * (1.06), 0, 7); ctx.stroke();
    // 内部瞳色
    const ig = ctx.createRadialGradient(mx, my, mr * .2, mx, my, mr * 1.02);
    ig.addColorStop(0, "rgba(255,240,210," + (.9 - k * .15) + ")");
    ig.addColorStop(.75, "rgba(120,90,60," + (.55 + k * .2) + ")");
    ig.addColorStop(1, "rgba(40,28,18,.85)");
    ctx.fillStyle = ig;
    ctx.beginPath(); ctx.arc(mx, my, mr * 1.02, 0, 7); ctx.fill();
    // 倒影里的两个人
    const a = clamp((t - 21.0) / 1.2);
    ctx.globalAlpha = a * .9;
    const by = my + mr * .22 - mr * .06 * Math.sin((t - 21) * 2);
    ctx.fillStyle = "rgba(30,20,12,.85)";
    // 小船
    ctx.beginPath();
    ctx.moveTo(mx - 58, by); ctx.lineTo(mx + 58, by);
    ctx.lineTo(mx + 40, by + 20); ctx.lineTo(mx - 40, by + 20); ctx.closePath(); ctx.fill();
    // 两个人剪影
    ctx.beginPath(); ctx.arc(mx - 16, by - 22, 11, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.arc(mx + 14, by - 19, 9, 0, 7); ctx.fill();
    ctx.fillRect(mx - 26, by - 14, 20, 16); ctx.fillRect(mx + 5, by - 12, 18, 14);
    ctx.restore();
  }
}

/* 纸浪：6 层，每层一条曲边 */
function drawWaveLayer(t, c, idx, yBase, amp, speed, alpha, xoff = 0) {
  ctx.save();
  ctx.globalAlpha = alpha;
  ctx.fillStyle = c.wave[idx % c.wave.length];
  ctx.beginPath();
  ctx.moveTo(-40, H + 40);
  const ph = idx * 1.7 + t * speed;
  for (let x = -40; x <= W + 40; x += 16) {
    const u = x / W;
    const y = yBase
      + Math.sin(u * 6.2 + ph) * amp * .55
      + Math.sin(u * 2.3 - ph * .7) * amp * .45
      + Math.sin(u * 11.0 + ph * 1.6) * amp * .18;
    ctx.lineTo(x + xoff, y);
  }
  ctx.lineTo(W + 40, H + 40);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

function drawWaves(t, c, sc, cam) {
  const bass = beatPulse(t);
  const total = 6;
  for (let i = 0; i < total; i++) {
    let rise = 1;
    // 启航：每拍升起一层
    if (t < 3.6) rise = smooth((t - i * BEAT) / .38);
    // 尾声：每拍落一层
    if (sc.id === 9) rise = 1 - smooth((t - (22.4 + i * BEAT)) / .4);
    // 不惶恐：拍点上抬一点
    const punch = sc.id === 4 ? bass * 14 : 0;

    const y = lerp(H * 1.02, H * (.62 + i * .062), rise) + punch * (1 - i / 8);
    const amp = (26 + i * 9) * (1 + (sc.id === 4 ? bass * .6 : 0));
    drawWaveLayer(t, c, i, y, amp, 1.1 + i * .35, 1 - i * .06);
  }
}

/* 纸船 + 男孩 + 灯笼 */
function paperBoat(x, y, s, rot, t, glow) {
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot); ctx.scale(s, s);
  ctx.fillStyle = "rgba(8,14,24,.9)";
  // 船体（折纸）
  ctx.beginPath();
  ctx.moveTo(-110, 0); ctx.lineTo(110, 0);
  ctx.lineTo(62, 46); ctx.lineTo(-62, 46); ctx.closePath(); ctx.fill();
  // 船帆似的纸片
  ctx.beginPath();
  ctx.moveTo(0, -78); ctx.lineTo(74, 4); ctx.lineTo(-4, 4); ctx.closePath();
  ctx.fillStyle = "rgba(18,28,42,.92)"; ctx.fill();
  // 男孩剪影
  const bob = Math.sin(t * 2.2) * 3;
  ctx.fillStyle = "rgba(6,10,18,.95)";
  ctx.beginPath(); ctx.arc(18, -74 + bob, 15, 0, 7); ctx.fill();      // 头
  ctx.beginPath();
  ctx.moveTo(4, -58 + bob); ctx.lineTo(34, -58 + bob);
  ctx.lineTo(30, -8); ctx.lineTo(8, -8); ctx.closePath(); ctx.fill(); // 身体
  ctx.strokeStyle = "rgba(6,10,18,.95)"; ctx.lineWidth = 7; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(8, -48 + bob); ctx.lineTo(-18, -34 + bob); ctx.stroke(); // 提灯的手
  // 灯笼
  const lx = -26, ly = -40 + bob;
  const lg = ctx.createRadialGradient(lx, ly, 2, lx, ly, 60);
  lg.addColorStop(0, "rgba(255,210,140," + (.95 * glow) + ")");
  lg.addColorStop(.35, "rgba(255,170,90," + (.45 * glow) + ")");
  lg.addColorStop(1, "rgba(255,150,60,0)");
  ctx.fillStyle = lg; ctx.beginPath(); ctx.arc(lx, ly, 60, 0, 7); ctx.fill();
  ctx.fillStyle = "#ffd79a";
  ctx.beginPath(); ctx.ellipse(lx, ly, 11, 14, 0, 0, 7); ctx.fill();
  ctx.restore();
}

/* 分镜 3：念想泡泡 */
function drawBubble(t, c, sc, cam) {
  const k = clamp((t - 5.7) / 1.55);
  const grow = smooth(clamp(k * 1.6)) * (1 + .06 * Math.sin(t * 9));
  const bx = W * .5, by = H * .40;
  const r = 150 * grow;
  ctx.save();
  ctx.globalAlpha = clamp(k * 2.2);
  // 泡泡外圈
  const g = ctx.createRadialGradient(bx, by, r * .2, bx, by, r);
  g.addColorStop(0, "rgba(255,236,205,.28)");
  g.addColorStop(.85, "rgba(255,236,205,.10)");
  g.addColorStop(1, "rgba(255,236,205,.55)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(bx, by, r, 0, 7); ctx.fill();
  ctx.strokeStyle = "rgba(255,240,215,.7)"; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(bx, by, r, 0, 7); ctx.stroke();
  // 里面的她（侧脸剪影）
  ctx.clip();
  ctx.fillStyle = "rgba(40,28,20,.55)";
  ctx.beginPath(); ctx.arc(bx + r * .06, by - r * .10, r * .26, 0, 7); ctx.fill();
  ctx.beginPath();
  ctx.moveTo(bx - r * .38, by + r * .62);
  ctx.quadraticCurveTo(bx - r * .05, by + r * .02, bx + r * .40, by + r * .62);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}

/* 分镜 4：纸鲸 */
function drawWhale(t, c, sc) {
  const k = (t - 7.4) / 3.0;
  if (k < 0 || k > 1) return;
  const p = smooth(k);
  const x = lerp(-260, W + 260, p);
  const y = H * .52 - Math.sin(p * Math.PI) * H * .22;
  const rot = Math.cos(p * Math.PI) * -.25;
  ctx.save();
  ctx.translate(x, y); ctx.rotate(rot);
  ctx.fillStyle = "rgba(10,18,30,.92)";
  // 身体
  ctx.beginPath();
  ctx.moveTo(-150, 0);
  ctx.bezierCurveTo(-150, -70, -40, -88, 40, -58);
  ctx.bezierCurveTo(110, -32, 150, -6, 168, 0);
  ctx.bezierCurveTo(120, 34, 20, 52, -70, 40);
  ctx.bezierCurveTo(-120, 32, -150, 16, -150, 0);
  ctx.fill();
  // 尾巴
  ctx.beginPath();
  ctx.moveTo(-140, 0); ctx.lineTo(-210, -52); ctx.lineTo(-176, 6);
  ctx.lineTo(-212, 52); ctx.closePath(); ctx.fill();
  // 眼睛
  ctx.fillStyle = "rgba(255,225,180,.85)";
  ctx.beginPath(); ctx.arc(118, -14, 7, 0, 7); ctx.fill();
  ctx.restore();
}

/* 分镜 5：码头与人来人往 */
function drawDock(t, c, sc) {
  const k = clamp((t - 10.4) / .8);
  ctx.save();
  ctx.globalAlpha = k;
  const y = H * .70;
  // 码头
  ctx.fillStyle = "rgba(70,42,48,.85)";
  ctx.fillRect(-60, y, W + 120, H * .34);
  ctx.fillStyle = "rgba(50,30,36,.9)";
  ctx.fillRect(-60, y, W + 120, 22);
  // 栏杆
  ctx.strokeStyle = "rgba(40,24,30,.8)"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(0, y - 40); ctx.lineTo(W, y - 40); ctx.stroke();
  for (let x = 40; x < W; x += 120) {
    ctx.beginPath(); ctx.moveTo(x, y - 46); ctx.lineTo(x, y - 6); ctx.stroke();
  }
  // 路人：每拍换一批，一左一右
  const batch = Math.floor((t - 10.4) / BEAT);
  for (let b = 0; b < 3; b++) {
    const seed = batch + b * 7;
    const dir = (seed % 2 === 0) ? 1 : -1;
    const prog = smooth(clamp((t - 10.4 - (b - 1) * BEAT * 1.2) / 2.6));
    const x = dir > 0 ? lerp(-80, W + 80, prog) : lerp(W + 80, -80, prog);
    const yy = y - 4;
    ctx.save();
    ctx.globalAlpha = k * (.35 + .2 * b);
    ctx.fillStyle = "rgba(46,28,34,.9)";
    person(x, yy, 1.05 + (seed % 3) * .1);
    ctx.restore();
  }
  ctx.restore();
}

function person(x, y, s) {
  ctx.save(); ctx.translate(x, y); ctx.scale(s, s);
  ctx.beginPath(); ctx.arc(0, -96, 17, 0, 7); ctx.fill();       // 头
  ctx.beginPath();
  ctx.moveTo(-22, -78); ctx.quadraticCurveTo(0, -86, 22, -78);
  ctx.lineTo(16, -6); ctx.lineTo(-16, -6); ctx.closePath(); ctx.fill(); // 身
  ctx.fillRect(-14, -6, 10, 40); ctx.fillRect(4, -6, 10, 40);   // 腿
  ctx.restore();
}

/* 分镜 6：两层纸像幕布分开 */
function drawCurtain(t, c, sc) {
  const k = smooth(clamp((t - 13.8 - BEAT) / 1.6));   // 卡在重拍
  if (k <= 0) return;
  const gap = k * (W * .62);
  ctx.save();
  ctx.fillStyle = "rgba(3,7,14,.96)";
  ctx.fillRect(W / 2 - gap / 2, 0, gap, H);
  // 撕裂的纸边
  ctx.fillStyle = mix("#2b3f5c", "#16233a", .4);
  for (const sgn of [-1, 1]) {
    ctx.beginPath();
    const edge = W / 2 + sgn * gap / 2;
    ctx.moveTo(edge, 0);
    for (let y = 0; y <= H; y += 60) {
      ctx.lineTo(edge + sgn * (Math.sin(y * .03) * 12 + 6), y);
    }
    ctx.lineTo(edge + sgn * 40, H); ctx.lineTo(edge + sgn * 40, 0);
    ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* 分镜 7：孔明灯 */
const lanternSeeds = Array.from({ length: 40 }, (_, i) => ({
  x: (i * 137.5) % W,
  ph: Math.random() * 6.28,
  sp: .5 + Math.random() * .5,
  sc: .6 + Math.random() * .7,
}));

function drawLanterns(t, c, sc) {
  if (sc.id < 7) return;
  const k = clamp((t - 17.3) / .4);
  ctx.save();
  ctx.globalAlpha = k * (sc.id === 9 ? .35 : 1);
  // 金色暖光
  const g = ctx.createLinearGradient(0, H, 0, H * .2);
  g.addColorStop(0, "rgba(255,150,60,.22)");
  g.addColorStop(1, "rgba(255,150,60,0)");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  const beatIdx = Math.floor((t - 17.3) / (BEAT / 2));
  lanternSeeds.forEach((l, i) => {
    if (i > beatIdx + 2) return;
    const born = 17.3 + i * (BEAT / 2);
    const age = t - born;
    if (age < 0) return;
    const y = H * .92 - age * 120 * l.sp;
    if (y < -80) return;
    const x = l.x + Math.sin(t * .8 + l.ph) * 22;
    const s = l.sc * (1 + .12 * beatPulse(t + i * .1));
    // 光斑
    const rg = ctx.createRadialGradient(x, y, 2, x, y, 54 * s);
    rg.addColorStop(0, "rgba(255,190,110,.55)");
    rg.addColorStop(1, "rgba(255,170,80,0)");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x, y, 54 * s, 0, 7); ctx.fill();
    // 灯身
    ctx.fillStyle = "rgba(255,222,170,.92)";
    ctx.beginPath();
    ctx.moveTo(x - 13 * s, y + 16 * s);
    ctx.lineTo(x - 10 * s, y - 12 * s);
    ctx.lineTo(x + 10 * s, y - 12 * s);
    ctx.lineTo(x + 13 * s, y + 16 * s);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = "rgba(255,160,70,.9)";
    ctx.fillRect(x - 8 * s, y + 12 * s, 16 * s, 3 * s);
  });
  ctx.restore();
}

/* 分镜 9：淡出 + 船驶进月亮 */
function endingAlpha(t) {
  if (t < 22.4) return 1;
  return 1 - smooth((t - 23.3) / .8);
}

/* ---------------- 主循环 ---------------- */
let t0 = performance.now(), paused = false, cur = 0;
let shownT = 0;

function renderAt(t) {
  const sc = secAt(t);
  const c = pal(t);
  const cam = camera(t);
  const pulse = beatPulse(t);

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = "#04070d";
  ctx.fillRect(0, 0, cv.width, cv.height);

  // 设计坐标变换
  ctx.save();
  ctx.translate(offX, offY);
  ctx.scale(scale, scale);
  ctx.translate(W / 2, H / 2);
  ctx.scale(cam.z, cam.z);
  ctx.translate(-W * cam.cx, -H * cam.cy);

  // 拍点轻震
  if (sc.id === 4) ctx.translate((Math.random() - .5) * 6 * pulse, (Math.random() - .5) * 6 * pulse);

  drawSky(t, c, sc);
  drawStars(t, c, sc);
  drawMoon(t, c, sc, cam);

  // 月亮复出（分镜 4）
  drawWaves(t, c, sc, cam);

  // 船位
  let bx = W * .5, by = H * .565, bs = 1, brot = Math.sin(t * 1.6) * .02;
  if (t < 3.6) {
    const riseB = smooth((t - 3.4) / .5);
    by = lerp(H * .78, H * .565, riseB);
    bs = lerp(.85, 1, riseB);
  }
  if (sc.id === 4) {
    const k = smooth(clamp((t - 8.0) / 2.0));
    bx = lerp(W * .5, W * .62, k);
    by = lerp(H * .575, H * .40, k);
    brot = -.22 * k + Math.sin(t * 2.4) * .03;
    bs = lerp(1, .9, k);
  }
  if (sc.id === 6) {
    bx = lerp(W * .5, W * .30, smooth((t - 14.2) / 2.2));
    bs = lerp(1, .82, smooth((t - 14.2) / 2.2));
  }
  if (sc.id === 9) {
    const k = smooth(clamp((t - 22.4) / 1.4));
    bx = lerp(W * .45, W * .5, k);
    by = lerp(H * .52, H * .27, k);
    bs = lerp(.82, .3, k);
    brot = lerp(0, -.1, k);
  }

  // 她（分镜 6）
  if (sc.id === 6 || t > 16.2) {
    const a = clamp((t - 13.8) / .8);
    ctx.save(); ctx.globalAlpha = a;
    ctx.fillStyle = "rgba(16,22,34,.9)";
    ctx.translate(W * .72, H * .58);
    ctx.beginPath(); ctx.arc(0, -120, 24, 0, 7); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(-34, -98); ctx.quadraticCurveTo(0, -112, 34, -98);
    ctx.lineTo(30, 60); ctx.lineTo(-30, 60); ctx.closePath(); ctx.fill();
    // 挥手
    const waveA = Math.sin(t * 8) * .5;
    ctx.save(); ctx.translate(30, -84); ctx.rotate(-.9 + waveA);
    ctx.fillRect(0, -8, 70, 14); ctx.restore();
    ctx.restore();
  }

  paperBoat(bx, by, bs, brot, t, .55 + .45 * pulse);

  drawBubble(t, c, sc, cam);
  drawWhale(t, c, sc);
  drawDock(t, c, sc);

  // 幕布分开（画在船与她对之间，制造两层纸）
  if (sc.id === 6) drawCurtain(t, c, sc);
  if (sc.id === 7 || sc.id === 8) drawLanterns(t, c, sc);

  // 纸纹总叠
  ctx.save();
  ctx.globalAlpha = .5; ctx.fillStyle = grainPat;
  ctx.fillRect(0, 0, W, H);
  ctx.restore();

  // 暗角
  const vg = ctx.createRadialGradient(W / 2, H / 2, H * .25, W / 2, H / 2, H * .78);
  vg.addColorStop(0, "rgba(0,0,0,0)");
  vg.addColorStop(1, "rgba(0,0,0,.55)");
  ctx.fillStyle = vg; ctx.fillRect(0, 0, W, H);

  // 结尾淡出
  const ea = endingAlpha(t);
  if (ea < 1) { ctx.fillStyle = `rgba(4,7,13,${1 - ea})`; ctx.fillRect(0, 0, W, H); }

  ctx.restore();

  // HUD
  bar.style.width = (t / DUR * 100).toFixed(2) + "%";
  secEl.textContent = (t < DUR ? SECTIONS.indexOf(sc) + 1 : 9) + " " + sc.name;
  clockEl.textContent = t.toFixed(1) + " / " + DUR + "s · 120BPM";
}

function loop(now) {
  if (!paused) {
    const elapsed = (now - t0) / 1000;
    shownT = elapsed % DUR;
  }
  renderAt(shownT);
  requestAnimationFrame(loop);
}

/* ---------------- 交互 ---------------- */
function togglePause() {
  if (paused) { paused = false; t0 = performance.now() - shownT * 1000; }
  else { paused = true; }
}
cv.addEventListener("click", togglePause);
addEventListener("keydown", e => {
  if (e.code === "Space") { e.preventDefault(); togglePause(); }
  if (e.code === "ArrowRight") { shownT = Math.min(DUR - .01, shownT + .5); t0 = performance.now() - shownT * 1000; }
  if (e.code === "ArrowLeft") { shownT = Math.max(0, shownT - .5); t0 = performance.now() - shownT * 1000; }
});

/* ---------------- 启动 ---------------- */
resize();
const jump = parseFloat(new URLSearchParams(location.search).get("t"));
if (!isNaN(jump)) { shownT = clamp(jump, 0, DUR); paused = true; t0 = performance.now() - shownT * 1000; }
requestAnimationFrame(loop);
</script>
</body>
</html>
